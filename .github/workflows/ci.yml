name: SaleTrack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SaleTrack.sln

      - name: Build
        run: dotnet build SaleTrack.sln -c Release --no-restore

      - name: Test
        run: dotnet test SaleTrack.Tests -c Release --no-build

      - name: Publish
        run: dotnet publish SaleTrack.Web -c Release --no-build -o publish

      - name: Save published application
        uses: actions/upload-artifact@v4
        with:
          name: saletrack-student
          path: publish/

  docker-check:
    runs-on: ubuntu-latest
    needs: build-test-publish

    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t saletrack-student:ci .
